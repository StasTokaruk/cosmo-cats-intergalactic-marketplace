components:
  schemas:
    CategoryDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      required:
        - name
    ProductDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
          format: double
        category:
          $ref: '#/components/schemas/CategoryDTO'
        description:
          type: string
        quantity:
          type: number
          format: double
      required:
        - category
        - description
        - name
        - price
        - quantity
    OrderDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductDetailDTO'
        totalPrice:
          type: number
          format: double
    ProductDetailDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        category:
          $ref: '#/components/schemas/CategoryDTO'
        description:
          type: string
      required:
        - category
        - description
        - name
    CartDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        products:
          type: array
          items:
            $ref: '#/components/schemas/ProductDetailDTO'
        totalPrice:
          type: number
          format: double
    ProductAvailabilityDTO:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        quantity:
          type: number
          format: double
      required:
        - name
        - quantity
